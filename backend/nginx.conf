# /etc/nginx/sites-available/raavi
server {
    listen 80;
    server_name raaviiplatform.com www.raaviiplatform.com api.raaviiplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name raaviiplatform.com www.raaviiplatform.com;

    # SSL - مسیر certificate هارو بعد از نصب certbot بروز کن
    ssl_certificate     /etc/letsencrypt/live/raaviiplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raaviiplatform.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # API بکند
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # CORS headers به عنوان safety net
        add_header 'Access-Control-Allow-Origin' 'https://raaviiplatform.com' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, x-ravi-bot-secret' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://raaviiplatform.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, x-ravi-bot-secret' always;
            add_header 'Content-Length' '0';
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
    }

    # فایل‌های آپلود
    location /uploads/ {
        proxy_pass http://localhost:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # فرانت Next.js
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # فایل‌های استاتیک Next.js - کش طولانی
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

# سرور جداگانه برای subdomain api (در صورت استفاده از api.raaviiplatform.com)
server {
    listen 443 ssl http2;
    server_name api.raaviiplatform.com;

    ssl_certificate     /etc/letsencrypt/live/raaviiplatform.com/fullchain.pem;
